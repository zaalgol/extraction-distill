[project]
name = "extraction-distill"
version = "0.1.0"
description = "Distill the osint-agents extractor (qwen3.6:27b) into a QLoRA-tuned Qwen3-8B served with vLLM"
requires-python = ">=3.12"

# No install step: steps 1-3 run in osint-agents' environment (they import osint), training
# and serving in the WSL venvs built by scripts/setup_*.sh. See README.md.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/unsloth_compiled_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
